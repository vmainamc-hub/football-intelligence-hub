name: debug-build
on:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build and capture output
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-error.log
          exit ${PIPESTATUS[0]}
      - name: Publish build diagnostics
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          BUILD_LOG: ${{ env.BUILD_LOG }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let log = fs.readFileSync('build-error.log', 'utf8');
            if (log.length > 50000) log = log.slice(-50000);
            const title = 'BUILD DIAGNOSTIC — latest main failure';
            const body = `Automated diagnostic for commit ${context.sha}.\n\n\`\`\`text\n${log}\n\`\`\``;
            const issues = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state:'open', per_page:100});
            const existing = issues.data.find(i => i.title === title);
            if (existing) await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body});
            else await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});
      - name: Fail after publishing diagnostics
        if: steps.build.outcome == 'failure'
        run: exit 1
